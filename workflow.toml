schema_version = 1
project = "gotth-infrastructure"
profile = "strict"
active = "extraction"

[settings]
worktree_root = "worktrees"
workflow_root = "workflow"
default_branch = "main"

[toolchain]
build = "go build ./..."
test = "go test -mod=readonly -race -cover ./..."
lint = "go vet -mod=readonly ./..."
format = "gofmt -w"
coverage = "go test -mod=readonly -coverprofile=coverage.out ./..."

[coverage]
map = "workflow/artifacts/global-coverage-map.md"
profile = "strict"
block_unresolved_high_risk = true
exception_expiry_days = 14

[feature.extraction]
id = "extraction"
slug = "extraction"
name = "Extract reusable operational containment contracts"
namespace = "ops"
parent = ""
state = "done"
risk = "high"
assurance = "traceable-tests"
created_at = "2026-09-03T00:18:00Z"
activated_at = "2026-09-03T00:18:00Z"
updated_at = "2026-09-03T00:30:00Z"
completed_at = "2026-09-03T00:30:00Z"
folder = "workflow/features/extraction"
worktree = "."
branch = "main"
scope = ["Extract application-container desired state, runtime verification, and recovery evidence contracts"]
non_goals = ["Mutate a live host", "Copy secrets or environment state", "Automate destructive restore"]
affected_files = ["**"]
invariants = ["Runtime is nonroot, read-only, capability-free, no-new-privileges, and loopback-only", "Mutation remains an explicit operator action"]
acceptance = ["Format, vet, race, containment, failure-path, and coverage gates pass"]

[feature.extraction.rollback]
strategy = "delete_unpublished_repository"
notes = "Extraction performs no live operational mutation"
data_loss_risk = false
requires_migration_down = false

[[feature.extraction.verification]]
id = "verify"
kind = "unit"
command = "make verify"
required = true
timeout_seconds = 600
side_effect = "local_write"
network = false
retries = 0
